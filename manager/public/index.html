<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Lantern</h1>
  <nav>
    <a href="#/jobs" data-nav="jobs">Jobs</a>
    <a href="#/workers" data-nav="workers">Workers</a>
  </nav>
  <span id="health" class="pill">—</span>
</header>
<main>
  <section id="view-jobs">
    <h2>Jobs</h2>
    <div class="card">
      <h3>New job</h3>
      <div id="job-type-picker" class="type-picker"></div>
      <form id="upload-form" hidden></form>
    </div>
    <div class="card table-card">
      <table id="jobs-table">
        <thead><tr><th>Job</th><th>Stage</th><th>Progress</th><th>Duration</th><th>Created</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="view-workers" hidden>
    <h2>Workers</h2>
    <div class="card">
      <form id="worker-form">
        <label>Host <input type="text" name="host" placeholder="192.168.1.10" required></label>
        <label>Port <input type="number" name="port" value="9500" min="1" max="65535" required></label>
        <label>Name <input type="text" name="name" placeholder="worker-1"></label>
        <button type="submit">Add worker</button>
      </form>
    </div>
    <div class="card table-card">
      <table id="workers-table">
        <thead><tr><th>Name</th><th>Host</th><th>Status</th><th>Last seen</th><th>Load</th><th>Current task</th><th>Model</th><th>Capabilities</th><th>Resources</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="view-job" hidden>
    <h2 id="job-title">Job</h2>
    <p><a href="#/jobs">← Jobs</a></p>
    <dl id="job-meta"></dl>
    <h3>Chunks</h3>
    <table id="chunks-table">
      <thead><tr><th>#</th><th>Range</th><th>State</th></tr></thead>
      <tbody></tbody>
    </table>
    <h3>Burn segments</h3>
    <table id="burn-table">
      <thead><tr><th>#</th><th>Range</th><th>State</th></tr></thead>
      <tbody></tbody>
    </table>
    <h3>Tasks</h3>
    <table id="tasks-table">
      <thead><tr><th>ID</th><th>Type</th><th>State</th><th>Attempts</th><th>Weight</th><th>Worker</th><th>Error</th></tr></thead>
      <tbody></tbody>
    </table>
    <h3>Downloads</h3>
    <ul id="downloads"></ul>
    <h3>Log</h3>
    <pre id="job-log"></pre>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
