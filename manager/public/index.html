<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LanTask</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>LanTask</h1>
  <nav>
    <a href="#/jobs" data-nav="jobs">Jobs</a>
    <a href="#/workers" data-nav="workers">Workers</a>
  </nav>
  <span id="health" class="pill">—</span>
</header>
<main>
  <section id="view-jobs">
    <h2>Jobs</h2>
    <form id="upload-form">
      <label>Video <input type="file" name="video" accept="video/*,audio/*" required></label>
      <label>Source language
        <select name="sourceLang">
          <option value="auto" selected>Auto</option>
          <option value="en">English</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
      </label>
      <label>Target language
        <select name="targetLang">
          <option value="zh-CN" selected>Chinese (Simplified)</option>
          <option value="en">English</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
      </label>
      <label>Whisper model
        <select name="model">
          <option value="tiny">tiny</option>
          <option value="base">base</option>
          <option value="small" selected>small</option>
          <option value="medium">medium</option>
          <option value="large-v3">large-v3</option>
        </select>
      </label>
      <label>Chunk minutes <input type="number" name="chunkMin" value="10" min="0.5" max="120" step="0.5"></label>
      <label>Overlap seconds <input type="number" name="overlapSec" value="10" min="0" max="120" step="1"></label>
      <label><input type="checkbox" name="translate" checked> Translate</label>
      <label><input type="checkbox" name="burnIn" checked> Burn-in subtitles</label>
      <label><input type="checkbox" name="bilingual"> Bilingual subtitles</label>
      <button type="submit">Upload</button>
      <span id="upload-status"></span>
    </form>
    <table id="jobs-table">
      <thead><tr><th>Job</th><th>Stage</th><th>Progress</th><th>Duration</th><th>Created</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="view-workers" hidden>
    <h2>Workers</h2>
    <form id="worker-form">
      <label>Host <input type="text" name="host" placeholder="192.168.1.10" required></label>
      <label>Port <input type="number" name="port" value="9500" min="1" max="65535" required></label>
      <label>Name <input type="text" name="name" placeholder="worker-1"></label>
      <button type="submit">Add worker</button>
    </form>
    <table id="workers-table">
      <thead><tr><th>Name</th><th>Host</th><th>Status</th><th>Last seen</th><th>Load</th><th>Model</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="view-job" hidden>
    <h2 id="job-title">Job</h2>
    <p><a href="#/jobs">← Jobs</a></p>
    <dl id="job-meta"></dl>
    <h3>Chunks</h3>
    <table id="chunks-table">
      <thead><tr><th>#</th><th>Range</th><th>State</th></tr></thead>
      <tbody></tbody>
    </table>
    <h3>Tasks</h3>
    <table id="tasks-table">
      <thead><tr><th>ID</th><th>Type</th><th>State</th><th>Attempts</th><th>Worker</th><th>Error</th></tr></thead>
      <tbody></tbody>
    </table>
    <h3>Downloads</h3>
    <ul id="downloads"></ul>
    <h3>Log</h3>
    <pre id="job-log"></pre>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
